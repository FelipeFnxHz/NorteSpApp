<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f16" />
    <meta name="description" content="NorteSp Roleplay — servidor de FiveM roleplay com economia própria, corporações e bot integrado ao Discord." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet" />
    <title>NorteSp Roleplay</title>
      <script>
      (function () {
        try {
          if (location.pathname.indexOf('/dashboard') !== 0) return;
          var raw = localStorage.getItem('norte.appearance.v1');
          if (!raw) return;
          var snap = JSON.parse(raw).snapshot;
          if (!snap) return;
          var mode = snap.theme === 'system'
            ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : snap.theme;
          var root = document.documentElement;
          root.setAttribute('data-theme', mode);
          for (var k in snap.attrs) root.setAttribute(k, snap.attrs[k]);
          var vars = mode === 'dark' ? snap.varsDark : snap.varsLight;
          for (var v in vars) root.style.setProperty(v, vars[v]);
          root.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
